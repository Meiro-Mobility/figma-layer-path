# Stages the package on npm, with provenance, when a GitHub release is published. A staged
# version goes live only when a maintainer approves it with 2FA, on npmjs.com under Staged
# Packages or with `npm stage approve <id>`, so no release reaches users without a person.
#
# npm authenticates the workflow through trusted publishing: it verifies GitHub's OIDC token
# against the package's trusted publisher settings on npmjs.com, which allow staging only, so
# no npm token is stored anywhere.
#
# Run it by hand (workflow_dispatch) to rehearse a release: every step runs except the real
# staging, which becomes `npm stage publish --dry-run`, and the tag check, which needs a
# release.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Lets npm verify this workflow through GitHub's OIDC token, for provenance and for
  # trusted publishing.
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No dependency cache: a release installs from the lockfile alone.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Check the npm version
        run: |
          required=11.15.0
          actual="$(npm --version)"
          # sort -V -C succeeds only when the lines are already in version order.
          if ! printf '%s\n%s\n' "$required" "$actual" | sort -V -C; then
            echo "npm $actual is older than $required, the minimum for staged publishing." >&2
            exit 1
          fi
          echo "npm $actual"

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Check the tag matches the version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$expected" ]; then
            echo "Release tag $TAG does not match package.json version, expected $expected." >&2
            exit 1
          fi

      - name: Stage for approval
        if: github.event_name == 'release'
        run: npm stage publish --access public --provenance

      - name: Stage for approval (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: npm stage publish --access public --dry-run
