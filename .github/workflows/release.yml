# Publishes the package to npm, with provenance, when a GitHub release is published.
#
# Run it by hand (workflow_dispatch) to rehearse a release: every step runs except the real
# publish, which becomes `npm publish --dry-run`, and the tag check, which needs a release.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Lets npm verify this workflow through GitHub's OIDC token, for provenance and for
  # trusted publishing.
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No dependency cache: a release installs from the lockfile alone.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Check the npm version
        run: |
          required=11.5.1
          actual="$(npm --version)"
          # sort -V -C succeeds only when the lines are already in version order.
          if ! printf '%s\n%s\n' "$required" "$actual" | sort -V -C; then
            echo "npm $actual is older than $required, the minimum for trusted publishing." >&2
            exit 1
          fi
          echo "npm $actual"

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Check the tag matches the version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$expected" ]; then
            echo "Release tag $TAG does not match package.json version, expected $expected." >&2
            exit 1
          fi

      - name: Publish
        if: github.event_name == 'release'
        env:
          # Only for the first publish, before trusted publishing can be configured for the
          # package. Once it is, npm authenticates through OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --access public --dry-run
